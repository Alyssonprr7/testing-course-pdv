# Configuracao usada apenas pelos testes.
#
# O application.properties principal aponta para o host "pdv-db", que so existe
# dentro da rede do Docker. Sem esta sobreposicao, o PdvApplicationTests falha ao
# subir o contexto com UnknownHostException quando o "mvn test" roda na maquina.
#
# Aqui o contexto sobe contra um banco H2 em memoria, com o schema gerado pelo
# Hibernate a partir das entidades. O Flyway fica desativado porque as migracoes
# do projeto usam recursos especificos do MySQL (triggers, por exemplo).
#
# Consequencia: o PdvApplicationTests verifica que o contexto Spring sobe, mas nao
# valida as migracoes nem as triggers. Esses efeitos continuam sendo verificados
# pelos testes manuais no ambiente Docker.

