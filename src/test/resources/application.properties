# Configuracao usada apenas pelos testes.

# Configuração do banco H2 em memória para testes
spring.datasource.url=jdbc:h2:mem:pdvtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# O Hibernate não tentará criar o banco
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Permite inicializar o banco através do script schema.sql
spring.datasource.initialization-mode=always

logging.level.org.hibernate.SQL=warn

# Impede que o Hibernate valide os identificadores de exportação duplicados do projeto original
spring.jpa.properties.hibernate.tool.schema.extract_metadata_from_database=false

spring.flyway.enabled=false